<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2F7F79">
<title>Seguimiento de L</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232F7F79'/%3E%3Cpath d='M30 62c0-14 8-26 20-26s20 12 20 26' fill='none' stroke='white' stroke-width='9' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Inicio de sesión (solo papás) -->
<section id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <h1>Seguimiento de <span class="bn"></span></h1>
    <p class="muted">Ingresa con tu cuenta familiar.</p>
    <label>Correo<input id="lEmail" type="email" autocomplete="username" required></label>
    <label>Contraseña<input id="lPass" type="password" autocomplete="current-password" required></label>
    <button class="btn primary block" type="submit">Entrar</button>
    <p id="lErr" class="error" role="alert"></p>
  </form>
</section>

<!-- App -->
<div id="app" class="hidden">
  <header class="top">
    <div>
      <h1>Seguimiento de <span class="bn"></span></h1>
      <p id="edad" class="muted"></p>
    </div>
    <div class="top-right">
      <span id="modeBadge" class="badge hidden"></span>
      <button id="btnSalir" class="icon-btn" title="Cerrar sesión" aria-label="Cerrar sesión">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- DÍA -->
    <section id="v-hoy" class="view">
      <div class="daynav">
        <button id="dPrev" class="icon-btn" aria-label="Día anterior"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <label class="daylabel"><strong id="dLabel"></strong><input id="dPick" type="date" aria-label="Elegir día"></label>
        <button id="dNext" class="icon-btn" aria-label="Día siguiente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div id="dayStats" class="stats"></div>
      <div id="satStrip"></div>
      <h2>Línea del día</h2>
      <div id="timeline" class="timeline"></div>
    </section>

    <!-- GRÁFICAS -->
    <section id="v-graf" class="view hidden">
      <div class="rangehead"><h2>Gráficas</h2><p class="muted rangetxt"></p></div>
      <div class="rangebar" data-range></div>
      <div id="charts"></div>
    </section>

    <!-- REPORTE -->
    <section id="v-rep" class="view hidden">
      <div class="rangehead">
        <div><h2>Reporte</h2><p class="muted rangetxt"></p></div>
        <button id="btnPrint" class="btn small noprint">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>PDF
        </button>
      </div>
      <div class="rangebar noprint" data-range></div>
      <div id="report"></div>
      <div id="shareBox" class="noprint"></div>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="Agregar registro"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

  <nav class="tabs" id="tabs">
    <button data-tab="hoy" class="on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Día
    </button>
    <button data-tab="graf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>Gráficas
    </button>
    <button data-tab="rep">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg>Reporte
    </button>
  </nav>
</div>

<!-- Selector de tipo -->
<dialog id="dlgTipo" class="sheet">
  <div class="sheet-head"><h2>¿Qué quieres registrar?</h2><button class="icon-btn" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div id="tipoGrid" class="tipogrid"></div>
</dialog>

<!-- Formulario -->
<dialog id="dlgForm" class="sheet">
  <form id="form" method="dialog" novalidate>
    <div class="sheet-head"><h2 id="fTitulo"></h2><button type="button" class="icon-btn" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="fCampos"></div>
    <div class="field"><label for="fFecha">Fecha y hora</label><input id="fFecha" type="datetime-local" required></div>
    <div class="field"><label for="fNota">Observaciones</label><textarea id="fNota" rows="3" placeholder="Cualquier detalle que ayude al médico…"></textarea></div>
    <div class="fotos">
      <div id="fFotos" class="thumbs"></div>
      <div class="foto-btns">
        <button type="button" class="btn" id="btnCam">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tomar foto
        </button>
        <button type="button" class="btn" id="btnGal">Elegir foto</button>
      </div>
      <input id="inCam" type="file" accept="image/*" capture="environment" class="hidden">
      <input id="inGal" type="file" accept="image/*" multiple class="hidden">
    </div>
    <p id="fErr" class="error" role="alert"></p>
    <div class="form-actions">
      <button type="button" id="fDel" class="btn danger hidden">Eliminar</button>
      <button type="submit" id="fOk" class="btn primary grow">Guardar</button>
    </div>
  </form>
</dialog>

<!-- Visor de foto -->
<dialog id="dlgImg" class="lightbox"><img id="bigImg" alt="Foto ampliada"><button class="icon-btn lb-close" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></dialog>

<div id="toast" class="toast hidden" role="status"></div>

<script src="vendor/chart.umd.js"></script>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="db.js"></script>
<script src="app.js"></script>
</body>
</html>
